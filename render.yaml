# Academic demonstration only. All resource plans are explicitly free.
services:
  - type: web
    name: saude-facil-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh /app/start-hosted.sh
    healthCheckPath: /api/operations/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: TLS_TERMINATION
        value: proxy
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: NOTIFICATION_MODE
        value: disabled
      - key: DATABASE_URL
        fromDatabase:
          name: saude-facil-demo-db
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: LOOKUP_HMAC_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PATIENT_PASSWORD
        generateValue: true
      - key: DEMO_STAFF_PASSWORD
        generateValue: true
databases:
  - name: saude-facil-demo-db
    databaseName: saude_facil_demo
    user: saude_demo
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
