name: Validate system
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saude_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: saude_facil_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U saude_test -d saude_facil_test' --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://saude_test:local_test_only@127.0.0.1:5432/saude_facil_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run prisma:generate
        working-directory: backend
      - run: npm run test:unit && npm run test:integration
        working-directory: backend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: backend
      - run: docker build -f backend/Dockerfile -t saude-facil:ci .
      - name: Validate container startup and migrations
        run: |
          node scripts/init-environment.mjs development
          APP_IMAGE=saude-facil:ci node scripts/stack.mjs development up -d --wait --wait-timeout 120 app
          node scripts/backup-stack.mjs development
      - name: Exercise encrypted backup and restore
        run: |
          container_id=$(APP_IMAGE=saude-facil:ci node scripts/stack.mjs development ps -q db)
          BACKUP_TEST_CONTAINER="$container_id" npm --prefix backend run test:backup
      - name: Clean up test containers
        if: always()
        run: |
          if test -f deploy/config/development.env; then
            node scripts/stack.mjs development down --volumes
          fi
